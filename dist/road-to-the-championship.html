<title>Road to the Championship</title>
<meta name="description" content="A high school basketball coaching simulation: recruit, develop, manage and strategize your way to the State title.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=Graduate&family=Permanent+Marker&display=swap">
<style>
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#E3E8EC; --ink:#17202B; --ink-2:#4A5563; --ink-3:#6B7684;
  --border:#CBD3DB; --border-2:#AEB9C4;
  --floor:#D9A566; --floor-2:#C68D4E;
  --board:#0E1116; --led:#FFB31A; --led-dim:#221A09; --led-red:#FF5A47;
  --wb:#FBFCFD; --marker:#1E56B8; --marker-red:#C8352B; --wb-frame:#9AA5B1;
  --good:#19804A; --warn:#9A5F0E; --bad:#C2372D; --info:#2563A8;
  --good-bg:#E3F3EA; --warn-bg:#FBF0DD; --bad-bg:#FBE6E4;
  --team:#A6192E; --team-ink:#FFFFFF; --team-2:#F2B632; --team-2-ink:#17202B;
  --focus:#1E56B8;
  --shadow:0 1px 2px rgba(23,32,43,.08),0 4px 14px rgba(23,32,43,.08);
  --r1:4px; --r2:8px;
  --f-display:"Graduate","Rockwell","Georgia",serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-data:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-marker:"Permanent Marker","Comic Sans MS","Chalkboard SE",cursive;
  --fs:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141A; --surface:#18202A; --surface-2:#212B37; --ink:#E8EDF2; --ink-2:#A9B4C0; --ink-3:#8793A1;
    --border:#2F3A47; --border-2:#445263; --wb:#F4F6F8;
    --good:#4CC384; --warn:#E6A54A; --bad:#F07266; --info:#6FA8E8;
    --good-bg:#16301F; --warn-bg:#35280F; --bad-bg:#3A1A17; --focus:#7FB2FF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#18202A; --surface-2:#212B37; --ink:#E8EDF2; --ink-2:#A9B4C0; --ink-3:#8793A1;
  --border:#2F3A47; --border-2:#445263; --wb:#F4F6F8;
  --good:#4CC384; --warn:#E6A54A; --bad:#F07266; --info:#6FA8E8;
  --good-bg:#16301F; --warn-bg:#35280F; --bad-bg:#3A1A17; --focus:#7FB2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
/* In-game theme overrides (Settings) */
body[data-gtheme="light"]{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#E3E8EC; --ink:#17202B; --ink-2:#4A5563; --ink-3:#6B7684;
  --border:#CBD3DB; --border-2:#AEB9C4; --wb:#FBFCFD;
  --good:#19804A; --warn:#9A5F0E; --bad:#C2372D; --info:#2563A8;
  --good-bg:#E3F3EA; --warn-bg:#FBF0DD; --bad-bg:#FBE6E4; --focus:#1E56B8; color-scheme:light;
}
body[data-gtheme="dark"]{
  --bg:#0F141A; --surface:#18202A; --surface-2:#212B37; --ink:#E8EDF2; --ink-2:#A9B4C0; --ink-3:#8793A1;
  --border:#2F3A47; --border-2:#445263; --wb:#F4F6F8;
  --good:#4CC384; --warn:#E6A54A; --bad:#F07266; --info:#6FA8E8;
  --good-bg:#16301F; --warn-bg:#35280F; --bad-bg:#3A1A17; --focus:#7FB2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}
body[data-gtheme="contrast"]{
  --bg:#000; --surface:#000; --surface-2:#111; --ink:#FFF; --ink-2:#FFF; --ink-3:#E0E0E0;
  --border:#FFF; --border-2:#FFF; --wb:#FFF; --marker:#0033AA; --marker-red:#B00000;
  --good:#5CFF9D; --warn:#FFD24A; --bad:#FF8A80; --info:#8EC5FF;
  --good-bg:#000; --warn-bg:#000; --bad-bg:#000; --focus:#FFEA00; --shadow:none; color-scheme:dark;
}
body.cb{ --good:#1F6FD1; --bad:#D55E00; --good-bg:#E2ECFA; --bad-bg:#FBE9DC; }
body.cb[data-gtheme="dark"], body.cb[data-gtheme="contrast"]{ --good:#6FB1FF; --bad:#FF9F4A; --good-bg:#10233A; --bad-bg:#3A2410; }

*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-60px;z-index:100;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:var(--r1)}
.skip:focus{top:8px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
svg.ico{width:1.25em;height:1.25em;flex:none;vertical-align:-.22em}
.coach-tip svg.ico{width:22px;height:22px;color:var(--warn);margin-top:2px}
.title-menu .btn.big svg.ico{width:24px;height:24px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px}
.muted{color:var(--ink-2)}
.eyebrow{font-family:var(--f-data);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:var(--r1);border:1.5px solid var(--border-2);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--team);color:var(--team-ink);border-color:var(--team);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{min-height:52px;padding:10px 22px;font-size:1.05rem}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:.9rem}
.kbd{font-family:var(--f-data);font-size:.78rem;border:1px solid currentColor;border-radius:3px;padding:0 5px;opacity:.75}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-data);font-weight:600;font-size:.82rem;letter-spacing:.03em;padding:1px 8px;border-radius:999px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good);border-color:currentColor}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:currentColor}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:currentColor}
.chip.team{background:var(--team);color:var(--team-ink);border-color:var(--team)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:16px}
.panel-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.panel-title h2{font-family:var(--f-display);font-weight:400;font-size:1.35rem;letter-spacing:.01em}

/* ===== Title screen ===== */
.title-screen{min-height:100vh;display:flex;flex-direction:column}
.rafters{position:relative;background:linear-gradient(#141B24,#1D2733);padding:0 16px 28px;overflow:hidden}
.rafters .beam{height:10px;background:#2B3643;margin:0 -16px;box-shadow:0 2px 0 #0B0F14}
.banners{display:flex;justify-content:center;gap:clamp(8px,3vw,28px);flex-wrap:wrap;margin-top:0}
.pennant{width:clamp(64px,11vw,96px);display:flex;flex-direction:column;align-items:center}
.pennant svg{display:block;width:100%;height:auto}
.title-hero{max-width:1200px;margin:0 auto;padding:28px 16px 8px;text-align:center;color:#F4F6F8}
.title-hero .logo-line{font-family:var(--f-data);letter-spacing:.3em;text-transform:uppercase;color:#FFB31A;font-weight:600}
.title-hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,7vw,4.6rem);line-height:1.02;margin:10px 0 12px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.title-hero p{color:#C9D2DC;max-width:62ch;margin:0 auto}
.title-floor{flex:1;background:var(--floor);position:relative;padding:28px 16px 40px}
.title-floor canvas{position:absolute;inset:0;width:100%;height:100%}
.title-menu{position:relative;max-width:560px;margin:0 auto;background:var(--surface);border-radius:var(--r2);box-shadow:var(--shadow);padding:20px;display:grid;gap:10px;border:1px solid var(--border)}
.title-menu .btn{width:100%;justify-content:flex-start;white-space:normal;text-align:left}
.title-menu .btn .sub{font-weight:400;color:inherit;opacity:.8;font-size:.9rem;margin-left:auto;text-align:right}
.title-menu .row2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.title-menu .row2 .btn{justify-content:center}
.diff-pick{border:0;padding:0;margin:0 0 4px;min-width:0}
.diff-pick .seg{width:100%}
.diff-pick .seg label{flex:1;min-width:0}
.diff-pick .seg span{min-height:44px;display:flex;align-items:center;justify-content:center}
.save-note{font-size:.9rem;color:var(--ink-2);text-align:center}

/* ===== App header ===== */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.team-id{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.team-id .crest{width:40px;height:40px;flex:none}
.team-id .nm{font-family:var(--f-display);font-size:1.05rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.team-id .sub{font-family:var(--f-data);font-size:.85rem;color:var(--ink-2);letter-spacing:.04em}
.meters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.meter{display:grid;grid-template-columns:auto auto;align-items:baseline;column-gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--r1);background:var(--bg);min-width:92px}
.meter .lbl{font-family:var(--f-data);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.meter .val{font-family:var(--f-data);font-weight:700;font-size:1.05rem;text-align:right;font-variant-numeric:tabular-nums}
.meter .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:2px}
.meter .bar i{display:block;height:100%;background:var(--ink-2)}
.meter.lowv .bar i{background:var(--bad)} .meter.midv .bar i{background:var(--warn)} .meter.hiv .bar i{background:var(--good)}
.meter.neg .val{color:var(--bad)}
.tools{display:flex;gap:4px}

/* ===== Hub ===== */
.hub{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding-block:16px 48px}
@media (max-width:980px){.hub{grid-template-columns:1fr}}
.road{background:linear-gradient(#18212C,#222D3A);border-radius:var(--r2);padding:0 16px 14px;color:#EEF2F6;position:relative;overflow:hidden}
.road .beam{height:8px;background:#34414F;margin:0 -16px 0}
.road-inner{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.road-info{flex:1;min-width:200px;padding-top:12px}
.road-info .wk{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.road-info .eyebrow{color:#FFB31A}
.road .banners{justify-content:flex-end;flex-wrap:nowrap}
.road .pennant{width:clamp(50px,8vw,72px)}
.road .pennant .pl{font-family:var(--f-data);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:#C9D2DC;text-align:center;margin-top:4px;line-height:1.1}

.stepper{display:flex;gap:0;list-style:none;margin:14px 0 0;padding:0;counter-reset:s;flex-wrap:wrap}
.stepper li{flex:1;min-width:96px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:3px solid var(--border);font-family:var(--f-data);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.85rem;color:var(--ink-3)}
.stepper li .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;font-size:.8rem;flex:none}
.stepper li.done{color:var(--good);border-color:var(--good)}
.stepper li.cur{color:var(--ink);border-color:var(--team)}
.stepper li.cur .dot{background:var(--team);color:var(--team-ink);border-color:var(--team)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-top:16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:700;cursor:pointer;color:var(--ink-2);white-space:nowrap;min-height:44px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--team)}
.tabpanel{padding-top:16px}

.cta-bar{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.cta-bar .why{color:var(--ink-2);font-size:.92rem;margin-right:auto}

/* Opponent strip */
.opp{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.opp .crest{width:56px;height:56px}
.opp .vs{font-family:var(--f-display);font-size:1.15rem;line-height:1.1}
.opp .facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* Whiteboard */
.whiteboard{background:var(--wb);color:#1B2530;border:10px solid var(--wb-frame);border-radius:6px;box-shadow:var(--shadow),inset 0 0 40px rgba(30,86,184,.05);padding:14px;position:relative}
.whiteboard .wb-title{font-family:var(--f-marker);color:var(--marker);font-size:1.35rem;line-height:1.1}
.wb-note{font-family:var(--f-marker);color:var(--marker-red);font-size:.95rem}
.days{display:grid;grid-template-columns:repeat(var(--days,4),1fr);gap:10px;margin-top:12px}
@media (max-width:640px){.days{grid-template-columns:repeat(2,1fr)}}
.day{min-height:104px;border:2px dashed #A8B3BF;border-radius:6px;background:transparent;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:#1B2530}
.day .dn{font-family:var(--f-data);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;color:#56616D}
.day .dr{font-family:var(--f-marker);font-size:1.12rem;color:var(--marker);line-height:1.15}
.day .dr.empty{color:#8C97A3;font-size:.95rem}
.day.active{border-style:solid;border-color:var(--marker);background:rgba(30,86,184,.06)}
.day.filled{border-style:solid;border-color:#C5CED8}
.day .clr{margin-top:auto;align-self:flex-end;font-size:.8rem;color:#56616D;text-decoration:underline;background:none;border:0;cursor:pointer;padding:2px}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.drill{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;border:1.5px solid var(--border-2);border-radius:var(--r1);background:var(--surface);cursor:pointer;min-height:64px}
.drill:hover{border-color:var(--team)}
.drill .dn{font-weight:700;display:flex;align-items:center;gap:6px}
.drill .dd{font-size:.82rem;color:var(--ink-2);line-height:1.3}
.drill .ico{width:18px;height:18px;flex:none}
.projection{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
.proj{border:1px solid var(--border);border-radius:var(--r1);padding:8px 10px;background:var(--bg)}
.proj .l{font-family:var(--f-data);text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;color:var(--ink-2)}
.proj .v{font-family:var(--f-data);font-weight:700;font-size:1.15rem}
.v.up{color:var(--good)} .v.down{color:var(--bad)}

/* Event memo */
.memo{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.memo-head{background:var(--team);color:var(--team-ink);padding:10px 16px;display:flex;align-items:center;gap:10px;font-family:var(--f-data);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.memo-body{padding:16px}
.memo-body h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin-bottom:8px}
.memo-body .story{max-width:65ch;font-size:1.05rem}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;padding:12px 14px;border:1.5px solid var(--border-2);border-radius:var(--r2);background:var(--surface);cursor:pointer}
.choice:hover{border-color:var(--team);background:var(--bg)}
.choice .k{grid-row:1/3;width:30px;height:30px;border-radius:var(--r1);background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-data);font-weight:700}
.choice .t{font-weight:700}
.choice .tags{display:flex;gap:6px;flex-wrap:wrap}
.outcome{margin-top:16px;padding:14px;border-left:4px solid var(--team);background:var(--bg);border-radius:0 var(--r1) var(--r1) 0}
.deltas{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Game prep */
.prep{display:grid;gap:16px}
.seg{display:flex;flex-wrap:nowrap;border:1.5px solid var(--border-2);border-radius:var(--r1);overflow:hidden;width:fit-content;max-width:100%}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;white-space:nowrap;padding:8px 12px;font-weight:700;min-height:40px;border-right:1px solid var(--border)}
.seg label:last-child span{border-right:0}
.seg input:checked + span{background:var(--ink);color:var(--bg)}
.seg input:focus-visible + span{outline:3px solid var(--focus);outline-offset:-3px}
.strat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}
.strat .hint{font-size:.88rem;color:var(--ink-2);margin-top:6px;min-height:2.6em}
.scout{border:1.5px dashed var(--border-2);border-radius:var(--r2);padding:12px}
.scout.known{border-style:solid;border-color:var(--team)}
.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:760px){.lineup{grid-template-columns:1fr 1fr}}
.slot{border:1px solid var(--border);border-radius:var(--r1);padding:8px;background:var(--bg)}
.slot label{font-family:var(--f-data);font-weight:700;letter-spacing:.06em;font-size:.8rem;color:var(--ink-2)}
.slot select{width:100%;margin-top:4px;min-height:40px;border:1px solid var(--border-2);border-radius:var(--r1);background:var(--surface);padding:4px}
.fit-good{color:var(--good)} .fit-bad{color:var(--bad)}

/* Roster */
.roster-list{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--border);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.prow:hover{background:var(--bg)}
.jersey{width:34px;height:34px;border-radius:6px 6px 10px 10px;background:var(--team);color:var(--team-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:.95rem;box-shadow:inset 0 3px 0 var(--team-2)}
.jersey.opp{background:var(--oc,#445);color:var(--oci,#fff);box-shadow:inset 0 3px 0 var(--oc2,#999)}
.prow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .meta{font-family:var(--f-data);font-size:.85rem;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ovr{font-family:var(--f-display);font-size:1.25rem;text-align:right;line-height:1}
.ovr small{display:block;font-family:var(--f-data);font-size:.7rem;color:var(--ink-2);letter-spacing:.06em}
.ebar{width:56px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:inline-block;vertical-align:middle}
.ebar i{display:block;height:100%;background:var(--good)}
.ebar.mid i{background:var(--warn)} .ebar.low i{background:var(--bad)}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r2)}
table.data{border-collapse:collapse;width:100%;font-size:.95rem}
table.data th,table.data td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
table.data th{font-family:var(--f-data);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;color:var(--ink-2);background:var(--bg)}
table.data td.n,table.data th.n{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:1rem}
table.data tr.me td{background:color-mix(in srgb,var(--team) 12%,transparent);font-weight:700}
table.data tr.cut td{border-bottom:2px dashed var(--ink-3)}

/* Attribute bars */
.attrs{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.attrs .an{font-family:var(--f-data);font-size:.85rem;letter-spacing:.04em;color:var(--ink-2)}
.attrs .ab{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;position:relative}
.attrs .ab i{position:absolute;inset:0 auto 0 0;background:var(--team)}
.attrs .ab u{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--ink-3) 0 3px,transparent 3px 6px);opacity:.45;text-decoration:none}
.attrs .av{font-family:var(--f-data);font-weight:700;font-variant-numeric:tabular-nums;min-width:3.4em;text-align:right}

/* Tryouts */
.try-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{border:1.5px solid var(--border);border-radius:var(--r2);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px}
.pcard.sel{border-color:var(--team);box-shadow:0 0 0 2px var(--team)}
.pcard .hd{display:flex;gap:10px;align-items:center}
.pcard .hd .who{flex:1;min-width:0}
.pcard .hd .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.needs{display:flex;gap:6px;flex-wrap:wrap}

/* Setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;padding-block:20px 48px}
@media (max-width:860px){.setup{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field > .lbl{font-weight:700}
.field input[type=text]{min-height:44px;padding:8px 12px;border:1.5px solid var(--border-2);border-radius:var(--r1);background:var(--surface);max-width:420px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .face{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border:1.5px solid var(--border-2);border-radius:var(--r2);cursor:pointer;min-width:84px;background:var(--surface)}
.opt input:checked + .face{border-color:var(--team);box-shadow:0 0 0 2px var(--team)}
.opt input:focus-visible + .face{outline:3px solid var(--focus);outline-offset:2px}
.opt .face svg{width:34px;height:34px}
.swatch{width:44px;height:28px;border-radius:4px;display:flex;overflow:hidden;border:1px solid rgba(0,0,0,.2)}
.swatch i{flex:1}
.diff .face{align-items:flex-start;min-width:180px;max-width:240px;text-align:left}
.preview-card{position:sticky;top:90px;align-self:start;text-align:center}
.preview-card .crest{width:160px;height:160px;margin:8px auto}

/* Game */
.game{padding-block:12px 40px;display:grid;gap:12px}
.scoreboard{background:var(--board);border-radius:10px;padding:10px 14px;color:#E9EDF1;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;box-shadow:0 6px 0 #05070A,var(--shadow);border:2px solid #232A33}
.sb-team{display:flex;align-items:center;gap:10px;min-width:0}
.sb-team.r{flex-direction:row-reverse;text-align:right}
.sb-team .tn{font-family:var(--f-data);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:clamp(.8rem,2vw,1.05rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-team .crest{width:40px;height:40px;flex:none}
.sb-score{display:flex;gap:2px}
.sb-mid{text-align:center;display:grid;gap:2px;justify-items:center}
.sb-mid .q{font-family:var(--f-data);color:#9AA6B2;letter-spacing:.12em;font-size:.8rem;text-transform:uppercase}
.seg7{display:block}
.game-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}
@media (max-width:980px){.game-main{grid-template-columns:1fr}}
.court-wrap{position:relative;background:var(--floor-2);border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow)}
.court-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:92/64}
.tol{display:flex;gap:3px;margin-top:4px}
.tol i{display:block;width:10px;height:10px;border-radius:2px;border:1.5px solid #6B7785}
.tol i.s{width:6px}
.tol i.on{background:var(--led);border-color:var(--led)}
.sb-team.r .tol{justify-content:flex-end}
.banner-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tbanner{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;height:56px;padding:4px 6px 12px;background:var(--team);color:var(--team-ink);clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);font-family:var(--f-display);font-size:.9rem;line-height:1;box-shadow:inset 0 4px 0 var(--team-2)}
.tbanner small{font-family:var(--f-data);font-size:.62rem;letter-spacing:.08em;margin-top:3px}
.grad{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.summer{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.summer .opt .face{align-items:flex-start;text-align:left;min-width:0;height:100%}
.summer .opt{display:block}
.budget-lines{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums;max-width:420px}
.budget-lines .tot{border-top:1px solid var(--border);padding-top:4px;font-weight:700}
.court-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2);margin-top:6px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.momentum{height:10px;border-radius:5px;background:var(--surface-2);position:relative;overflow:hidden;flex:1;min-width:120px}
.momentum i{position:absolute;top:0;bottom:0;left:50%;background:var(--team);transition:all .3s}
.pbp{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);display:flex;flex-direction:column;max-height:520px}
.pbp h3{padding:10px 12px;border-bottom:1px solid var(--border);font-family:var(--f-data);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;color:var(--ink-2)}
.pbp ol{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.pbp li{padding:7px 12px;border-bottom:1px solid var(--border);font-size:.92rem;display:grid;grid-template-columns:auto 1fr;gap:8px}
.pbp li .tm{font-family:var(--f-data);color:var(--ink-3);font-variant-numeric:tabular-nums}
.pbp li.us b{color:var(--ink)} .pbp li.score{background:color-mix(in srgb,var(--team) 8%,transparent)}
.pbp li.big{font-weight:700}
.timeout{border:2px solid var(--team);border-radius:var(--r2);background:var(--surface);padding:16px}
.timeout h2{font-family:var(--f-display);font-weight:400;font-size:1.35rem}

/* Recap / ending */
.result-banner{border-radius:var(--r2);padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:#fff;background:#2A3542}
.result-banner.win{background:var(--team);color:var(--team-ink)}
.result-banner .big{font-family:var(--f-display);font-size:clamp(1.8rem,5vw,2.8rem);line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.list-plain{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list-plain li{display:flex;gap:8px;align-items:baseline}
.ending-hero{text-align:center;padding:28px 16px 8px}
.ending-hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,6vw,3.6rem)}
.grade{font-family:var(--f-display);font-size:4rem;line-height:1;color:var(--team)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ach .a{border:1.5px solid var(--border);border-radius:var(--r2);padding:10px;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.ach .a.got{border-color:var(--team)}
.ach .a.no{opacity:.6}
.ach .a svg{width:30px;height:30px;flex:none}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;overflow-x:auto}
.bround{display:flex;flex-direction:column;gap:8px;justify-content:center}
.bround h3{font-family:var(--f-data);text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--ink-2)}
.bgame{border:1px solid var(--border);border-radius:var(--r1);background:var(--surface);font-size:.9rem}
.bgame div{padding:6px 8px;display:flex;justify-content:space-between;gap:6px}
.bgame div + div{border-top:1px solid var(--border)}
.bgame .me{font-weight:700;background:color-mix(in srgb,var(--team) 12%,transparent)}
.bgame .lost{opacity:.55;text-decoration:line-through}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,12,18,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.modal{background:var(--surface);color:var(--ink);border-radius:var(--r2);max-width:760px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);margin-block:24px;border:1px solid var(--border)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);border-radius:var(--r2) var(--r2) 0 0;z-index:1}
.modal-h h2{font-family:var(--f-display);font-weight:400;font-size:1.3rem;flex:1}
.modal-b{padding:16px;display:grid;gap:14px}
.rules h3{font-family:var(--f-data);text-transform:uppercase;letter-spacing:.08em;font-size:.95rem;margin:6px 0 4px;color:var(--ink)}
.rules p,.rules li{max-width:68ch}
.rules ul{margin:4px 0;padding-left:20px}
.rules-nav{display:flex;gap:6px;flex-wrap:wrap}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;border-bottom:1px solid var(--border)}
.settings-row .d{font-size:.88rem;color:var(--ink-2)}

.toast-host{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r1);box-shadow:var(--shadow);font-weight:700;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.coach-tip{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn);color:var(--ink);border-radius:var(--r2);padding:10px 12px;margin-bottom:12px}
.coach-tip b{color:var(--warn)}
.coach-tip .x{margin-left:auto}
.spark{width:100%;height:auto;display:block}

body.rm *,body.rm *::before,body.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){ body:not(.motion-on) *{animation:none!important;transition:none!important} }
@media (max-width:560px){
  .topbar{position:static}
  .topbar .wrap{gap:8px}
  .meters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;margin-left:0;gap:4px;order:3}
  .meter{min-width:0;grid-template-columns:1fr;padding:3px 5px;text-align:center}
  .meter .lbl{font-size:.68rem;letter-spacing:.02em}
  .meter .val{text-align:center;font-size:.92rem;white-space:nowrap}
  .tools{margin-left:auto}
  .seg span{padding:8px 10px}
  .stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .stepper li{min-width:0;flex-direction:column;gap:2px;padding:6px 2px;font-size:.72rem;text-align:center;letter-spacing:.02em}
  .title-menu .row2{grid-template-columns:1fr}
  .title-menu .btn .sub{display:none}
  .scoreboard{grid-template-columns:1fr auto 1fr;padding:8px}
  .sb-team .crest{display:none}
}

/* Opening night: title screen */
.arena-title{--arena-navy:#101d2c;--arena-orange:#ff6335;--arena-paper:#f5f0e7;background:var(--arena-paper);color:var(--arena-navy);min-height:100svh;padding:0 clamp(20px,4vw,64px);overflow:hidden}
.arena-mast,.arena-footer{display:flex;align-items:center;justify-content:space-between;gap:20px;font-family:var(--f-data);font-weight:600;letter-spacing:.12em;font-size:.75rem}
.arena-mast{padding:24px 0;border-bottom:1px solid #101d2c33}
.arena-brand{display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:700}
.arena-brand .ico{color:#c53f19}.arena-brand span{font-size:.7rem;letter-spacing:.13em;margin-left:12px}
.arena-edition{border:1px solid #101d2c55;padding:6px 10px}
.arena-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,.85fr);gap:clamp(32px,5vw,80px);max-width:1440px;width:100%;margin:auto;padding:48px 0 36px;align-items:center}
.arena-story{min-width:0;position:relative}
.arena-kicker{display:flex;align-items:center;gap:8px;font-family:var(--f-data);font-size:.76rem;font-weight:600;letter-spacing:.1em}
.arena-kicker>span{width:7px;height:7px;border-radius:50%;background:#c53f19;box-shadow:0 0 0 4px #c53f1918}
.arena-story h1{font-family:var(--f-data);font-size:clamp(3rem,6.5vw,7rem);font-weight:700;line-height:.94;letter-spacing:-.04em;margin:25px 0;text-wrap:initial}

.arena-deck strong{font-weight:700}.arena-copy{max-width:47ch;margin-top:16px;color:#505761;font-size:.96rem;line-height:1.65}
.arena-court{position:relative;height:220px;margin:30px 0 0;background:#c18e55;overflow:hidden;border:1px solid #101d2c26;border-radius:3px;transform:rotate(-2deg);box-shadow:9px 10px 0 #101d2c0c}
.arena-court:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,#22120933,transparent 60%);pointer-events:none}
.arena-court canvas{width:100%;height:100%;position:absolute;inset:0}
.arena-court-label{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;color:#322318;font:600 .65rem var(--f-data);letter-spacing:.15em}

.arena-stamp span{display:block;font-size:1rem;letter-spacing:.2em;line-height:1.8}.arena-stamp small{font-size:.6rem;letter-spacing:.16em;display:block;color:#ffac74;border-top:1px solid #ffffff44;line-height:2}
.arena-pillars{display:flex;justify-content:space-between;gap:10px;padding:24px 0 0;font:600 .8rem var(--f-data);letter-spacing:.14em}.arena-pillars b{color:#b74120;margin-right:8px}
.arena-menu{--ink:#f5f0e7;--ink-2:#b8c4d0;--surface:#17283b;--surface-2:#253b52;--border-2:#496077;--focus:#ffc777;width:100%;max-width:none;background:#101d2c;color:#f5f0e7;border:0;border-radius:6px;padding:28px;gap:12px;box-shadow:0 22px 50px #14233525;align-self:center}
.arena-menu-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.arena-menu-head .eyebrow{font-size:.72rem;letter-spacing:.15em;color:#b5c4d4}.arena-live{font:.62rem var(--f-data);letter-spacing:.1em;color:#ffb891;border:1px solid #ffb89155;padding:4px 7px;border-radius:3px}
.arena-menu h2{font:600 2.2rem var(--f-data);letter-spacing:-.02em;margin-top:7px}.arena-menu-copy{color:#b8c4d0;font-size:.9rem;margin-top:-9px}
.arena-menu .diff-pick{margin:13px 0 1px}.arena-menu legend{margin-bottom:8px;color:#b8c4d0;font-size:.72rem}.arena-menu .seg{background:#0b1420}.arena-menu .seg span{font-size:.95rem}.arena-menu .seg input:checked+span{background:#f5f0e7;color:#101d2c;border-color:#f5f0e7}.arena-menu #tdiff-d{font-size:.79rem;color:#b8c4d0;margin-top:8px;min-height:2.8em}

.arena-menu .arena-start{background:#ff7347;color:#131d29;border-color:#ff7347}.arena-menu .arena-start:hover{background:#ff956f;border-color:#ff956f;transform:translateY(-2px)}
.arena-menu .arena-custom{background:#1c2c3e;border-color:#42566c;color:#f5f0e7}.arena-menu small{display:block;font-family:var(--f-body);font-size:.76rem;font-weight:400;letter-spacing:0;margin-top:3px}
.arena-menu .row2{gap:6px;border-top:1px solid #ffffff24;padding-top:14px;margin-top:3px}.arena-menu .row2 .btn{background:transparent;border-color:transparent;padding:6px 2px;font-size:.77rem;min-height:40px;color:#dce4ec}.arena-menu .row2 .btn:hover{background:#253b52}
.arena-menu .save-note{font:500 .61rem var(--f-data);letter-spacing:.08em;color:#a8b9ca}
.arena-ticket{display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:10px;border-top:1px dashed #ffffff40;padding-top:16px;margin-top:8px}.arena-ticket>span{grid-column:1;font:500 .66rem var(--f-data);letter-spacing:.14em;color:#ffb891}.arena-ticket>strong{font:500 1.2rem/1.1 var(--f-data)}.arena-ticket .banners{grid-column:2;grid-row:1/3;flex-wrap:nowrap;gap:4px}.arena-ticket .pennant{width:40px;max-width:24%}
.arena-footer{padding:18px 0 24px;border-top:1px solid #101d2c33;color:#59616b;font-size:.65rem}.arena-footer kbd{font:inherit;border:1px solid #101d2c33;padding:1px 4px;margin-left:8px}
.arena-story,.arena-menu{animation:arena-enter .7s ease-out both}.arena-menu{animation-delay:.12s}@keyframes arena-enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:1500px){.arena-story h1{font-size:6.8rem}}
@media(max-width:1000px){.arena-main{gap:28px;grid-template-columns:minmax(0,1fr) minmax(300px,.85fr)}.arena-menu{padding:22px}.arena-story h1{font-size:5.5vw}.arena-kicker{font-size:.63rem}.arena-brand span{display:none}}

/* First-entry guided tour */
#coach-tour{position:fixed;inset:0;z-index:90;isolation:isolate}
.tour-blocker{position:absolute;inset:0;touch-action:none}
.tour-spot{position:fixed;border:2px solid #ffc16f;border-radius:8px;box-shadow:0 0 0 9999px #06111dcc;pointer-events:none;animation:tour-glow 1.8s ease-in-out infinite}

function allRecord() { return { w: G.games.filter(g => g.win).length, l: G.games.filter(g => !g.win).length }; }
function legacy() {
  const rec = allRecord(); const gp = Math.max(1, rec.w + rec.l);
  const prog = { champion: 400, perfect: 450, runnerup: 310, final4: 240, contender: 170, missed: 60, crisis: 0 }[G.ending.kind];
  const parts = [
    { k: 'Championship run', v: prog, max: 450 },
    { k: 'Win percentage', v: Math.round(200 * rec.w / gp), max: 200 },
    { k: 'Team morale', v: Math.round(teamMorale()), max: 100 },
    { k: 'Chemistry', v: Math.round(G.res.chem / 2), max: 50 },
    { k: 'Reputation', v: Math.round(G.res.rep), max: 100 },
    { k: 'Player development', v: Math.min(100, Math.max(0, Math.round(U.sum(G.roster.map(p => ovr(p) - p.start)) * 2))), max: 100 },
    { k: 'Budget health', v: G.res.budget >= 0 ? Math.min(50, Math.round(25 + G.res.budget / 80)) : 0, max: 50 },
  ];
  const total = U.sum(parts.map(p => p.v)); const max = U.sum(parts.map(p => p.max));
  const pct = total / max; const grade = pct >= .9 ? 'A+' : pct >= .8 ? 'A' : pct >= .7 ? 'B' : pct >= .58 ? 'C' : pct >= .45 ? 'D' : 'F';
  return { parts, total, max, grade };
}

/* What if, Coach? Controlled counterfactual replays never advance the saved season. */
function filmSnapshot() {
  const { filmBaseline, filmResult, ...state } = G;
  return { state: U.clone(state), opponent: currentGameInfo().opp.name, label: currentGameInfo().label };
}
function filmExperiment(snapshot, alternative) {
  const live = G;
  const run = strategy => {
    G = U.clone(snapshot.state);
    G.strategy = { ...G.strategy, ...strategy };
    if (G.strategy.rot === 'manual') G.strategy.rot = 'normal';
    const sim = newGameSim(); sim.headless = true;
    const quarters = [];
    for (let guard = 0; !sim.done && guard < 30; guard++) {
      if (sim.q === 2 && !sim.halfTalk) applyHalftime(sim, 'calm');
      simQuarter(sim); quarters.push({ us: sim.us, them: sim.them });
    }
    if (!sim.done) throw new Error('Replay exceeded its simulation limit.');
    const box = sim.my.map(id => sim.box[id]);
    return { us: sim.us, them: sim.them, quarters, threes: U.sum(box.map(b => b.tpm)), rebounds: U.sum(box.map(b => b.reb)), energy: Math.round(U.avg(G.roster.filter(eligible).map(p => p.gEnergy ?? p.energy))), strategy: { ...G.strategy } };
  };
  try {
    return { original: run(snapshot.state.strategy), alternative: run(alternative) };
  } finally { G = live; }
}
function filmDemo() {
  const live = G;
  try {
    newGame({ name: 'Riverside', seed: 'DECISION-REPLAY-2027', diff: 'varsity' });
    autoSignBest(); finalizeTryouts();
    return filmSnapshot();
  } finally { G = live; }
}

function drawEvent() {
  const playoff = G.phase === 'playoffs';
  const forced = EVENTS.find(e => e.forced && e.forced() && !G.usedEvents.includes(e.id));
  let pool = EVENTS.filter(e => !G.usedEvents.includes(e.id) && (!!e.playoff === playoff || (!e.playoff && playoff && ['trash', 'media', 'gym', 'flu', 'quit', 'friction'].includes(e.id))) && e.cond());
  if (!pool.length) pool = EVENTS.filter(e => (!!e.playoff === playoff) && e.cond());
  const ev = forced || pick(pool);
  G.usedEvents.push(ev.id);
  const ctx = ev.ctx();
  const text = ev.text(ctx);
  G.event = { id: ev.id, text, ctxIds: Object.fromEntries(Object.entries(ctx).map(([k, v]) => [k, v && v.id ? v.id : null])) };
  G._ctx = ctx; // live context (non-serialized objects are fine; transfer players are regenerated on reload)
  return G.event;
}
function eventCtx() {
  if (G._ctx) return G._ctx;
  const ev = EVENTS.find(e => e.id === G.event.id); const ctx = {};
  for (const [k, id] of Object.entries(G.event.ctxIds || {})) ctx[k] = G.roster.find(p => p.id === id) || null;
  if (ev.id === 'transfer' && !ctx.p) Object.assign(ctx, ev.ctx());
  if (ev.id === 'trash') ctx.o = currentOpp();
  G._ctx = ctx; return ctx;
}
function resolveEvent(i) {
  const ev = EVENTS.find(e => e.id === G.event.id); const ch = ev.choices[i]; const ctx = eventCtx();
  const out = ch.go(ctx);
  G.eventDone = { choice: i, label: typeof ch.t === 'function' ? ch.t(ctx) : ch.t, text: out.text, chips: out.chips };
  G.log.push({ w: G.phase === 'playoffs' ? 'P' : G.week, t: `${ev.title}: ${G.eventDone.label}. ${out.text}` });
  delete G._ctx;
  validateLineup();
  return out;
}

   AUDIO (Web Audio API, all sounds synthesized, no audio files)
   GRAPHICS (SVG crests & icons, 7-segment scoreboard, Canvas court)
   ========================================================================= */
'use strict';

const SFX = {
  ctx: null, on: true, vol: .6, master: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = this.vol; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; }
  },
  setVol(v) { this.vol = v; if (this.master) this.master.gain.value = v; },
  ok() { return this.on && this.ctx && this.ctx.state !== 'closed'; },
  env(g, t, a, d, peak) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  tone(f, dur, type = 'sine', peak = .25, slideTo = null, delay = 0) {
    if (!this.ok()) return; const c = this.ctx, t = c.currentTime + delay; const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    this.env(g, t, .01, dur, peak); o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + .05);
  },
  noise(dur, freq, q = 1, peak = .3, type = 'bandpass', attack = .01, delay = 0) {
    if (!this.ok()) return; const c = this.ctx, t = c.currentTime + delay; const len = Math.floor(c.sampleRate * (dur + attack + .05));
    const buf = c.createBuffer(1, len, c.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; const g = c.createGain();
    this.env(g, t, attack, dur, peak); s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t + dur + attack + .05);
  },
  click() { this.tone(880, .05, 'triangle', .12); },
  swish() { this.noise(.18, 3800, 1.2, .35, 'bandpass', .02); },
  rim() { this.tone(210, .12, 'triangle', .22, 150); this.noise(.06, 1200, 2, .12); },
  whistle() { if (!this.ok()) return; const c = this.ctx, t = c.currentTime; const o = c.createOscillator(), l = c.createOscillator(), lg = c.createGain(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = 2900; l.frequency.value = 38; lg.gain.value = 140; l.connect(lg).connect(o.frequency); this.env(g, t, .02, .35, .18); o.connect(g).connect(this.master); o.start(t); l.start(t); o.stop(t + .45); l.stop(t + .45); },
  buzzer() { this.tone(196, .9, 'square', .12); this.tone(147, .9, 'sawtooth', .06); },
  cheer(big) { this.noise(big ? 1.6 : .9, 900, .6, big ? .32 : .18, 'lowpass', .25); },
  good() { [523, 659, 784].forEach((f, i) => this.tone(f, .14, 'triangle', .16, null, i * .08)); },
  bad() { this.tone(392, .18, 'triangle', .14, 330); this.tone(294, .26, 'triangle', .12, 247, .14); },
  fanfare() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, .22, 'square', .07, null, i * .12)); this.cheer(true); },
  // Live crowd: a looping filtered-noise bed that swells on big plays
  crowd: null,
  crowdStart(level = 1) {
    if (!this.ok() || this.crowd) return; const c = this.ctx; const len = c.sampleRate * 2; const buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); let last = 0; for (let i = 0; i < len; i++) { last = last * .97 + (Math.random() * 2 - 1) * .03; d[i] = (Math.random() * 2 - 1) * .5 + last * 6; } }
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = .45;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    const g = c.createGain(); const base = .045 * level; g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(base, c.currentTime + 1.2);
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = .23; lg.gain.value = base * .35; lfo.connect(lg).connect(g.gain);
    src.connect(bp).connect(lp).connect(g).connect(this.master); src.start(); lfo.start();
    this.crowd = { src, g, lfo, base };
  },
  crowdSwell(amount = 1) { const cr = this.crowd; if (!cr || !this.ok()) return; const t = this.ctx.currentTime; const peak = cr.base + .16 * amount;
    cr.g.gain.cancelScheduledValues(t); cr.g.gain.setValueAtTime(Math.max(cr.g.gain.value, .0001), t); cr.g.gain.linearRampToValueAtTime(peak, t + .18); cr.g.gain.linearRampToValueAtTime(cr.base, t + 1.9); },
  crowdStop() { const cr = this.crowd; if (!cr) return; this.crowd = null; try { const t = this.ctx.currentTime; cr.g.gain.cancelScheduledValues(t); cr.g.gain.setValueAtTime(Math.max(cr.g.gain.value, .0001), t); cr.g.gain.exponentialRampToValueAtTime(.0001, t + .8); cr.src.stop(t + .9); cr.lfo.stop(t + .9); } catch (e) {} },
};

/* ---------- Original procedural soundtrack (Web Audio). Plays on menus; the crowd takes over during games. ---------- */
const Music = {
  on: true, vol: .35, gain: null, timer: 0, step: 0, next: 0, playing: false,
  BPM: 104,
  CHORDS: [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50]], // C, Am, F, G (MIDI)
  CHORDS_B: [[45, 48, 52], [41, 45, 48], [48, 52, 55], [43, 47, 50]], // Am, F, C, G
  LEAD: [[0, 2, 4, -1, 2, -1, 4, 5, 4, -1, 2, 0, -1, 2, 4, -1], [4, -1, 5, 4, 2, -1, 0, -1, 2, 4, -1, 7, 5, -1, 4, -1]],
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  ensure() { SFX.init(); const c = SFX.ctx; if (!c) return null; if (!this.gain) { this.gain = c.createGain(); this.gain.gain.value = 0; this.gain.connect(c.destination); } return c; },
  setVol(v) { this.vol = v; if (this.gain && SFX.ctx) this.gain.gain.setTargetAtTime(this.playing ? v * .5 : 0, SFX.ctx.currentTime, .1); },
  play() {
    if (!this.on || !SFX.on || this.playing) return; const c = this.ensure(); if (!c || c.state !== 'running') return;
    this.playing = true; this.step = 0; this.next = c.currentTime + .1; this.gain.gain.setTargetAtTime(this.vol * .5, c.currentTime, .4);
    clearInterval(this.timer); this.timer = setInterval(() => this.schedule(), 60);
  },
  stop() { if (!this.playing) return; this.playing = false; clearInterval(this.timer); if (this.gain && SFX.ctx) this.gain.gain.setTargetAtTime(0, SFX.ctx.currentTime, .25); },
  note(f, t, dur, type, peak, cutoff) { const c = SFX.ctx; const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f; let node = o;
    if (cutoff) { const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff; o.connect(lp); node = lp; }
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur); node.connect(g).connect(this.gain); o.start(t); o.stop(t + dur + .05); },
  drum(kind, t) { const c = SFX.ctx;
    if (kind === 'kick') { const o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + .14); g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.connect(g).connect(this.gain); o.start(t); o.stop(t + .2); return; }
    const len = Math.floor(c.sampleRate * .12); const buf = c.createBuffer(1, len, c.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const sN = c.createBufferSource(); sN.buffer = buf; const f = c.createBiquadFilter(); const g = c.createGain();
    if (kind === 'snare') { f.type = 'bandpass'; f.frequency.value = 1800; g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.0001, t + .12); }
    else { f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.0001, t + .04); }
    sN.connect(f).connect(g).connect(this.gain); sN.start(t); sN.stop(t + .13); },
  schedule() {
    const c = SFX.ctx; if (!c || !this.playing) return; const sixteenth = 60 / this.BPM / 4;
    while (this.next < c.currentTime + .25) {
      const st = this.step % 16, bar = Math.floor(this.step / 16) % 4, section = Math.floor(this.step / 64) % 2; const t = this.next;
      const chord = (section ? this.CHORDS_B : this.CHORDS)[bar];
      if (st === 0 || st === 8 || st === 10) this.drum('kick', t);
      if (st === 4 || st === 12) this.drum('snare', t);
      if (st % 2 === 0) this.drum('hat', t);
      if (st === 0 || st === 6 || st === 8 || st === 14) this.note(this.hz(chord[0] - 12), t, sixteenth * 1.8, 'triangle', .28);
      if (st === 4 || st === 12) chord.forEach(m => this.note(this.hz(m + 12), t, sixteenth * 1.2, 'square', .035, 1400));
      const li = this.LEAD[(bar + section) % 2][st]; if (li >= 0) { const scale = [0, 2, 4, 7, 9, 12, 14, 16]; /* C major pentatonic fits every chord */ this.note(this.hz(72 + scale[li % scale.length]), t, sixteenth * 1.6, 'triangle', .07); }
      this.next += sixteenth; this.step++;
    }
  },
};

/* ---------- Color helpers (WCAG contrast) ---------- */
function lum(hex) { const c = hex.replace('#', ''); const v = [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16) / 255).map(x => x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4)); return .2126 * v[0] + .7152 * v[1] + .0722 * v[2]; }
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
function inkOn(hex) { return contrast(hex, '#FFFFFF') >= contrast(hex, '#111418') ? '#FFFFFF' : '#111418'; }

function practiceResults() {

/* Game prep */
function prepPanel() {
  validateLineup();
  const info = currentGameInfo(); const opp = info.opp; const sc = isScouted(); const { rec, why } = recommend(opp); const st = G.strategy; const star = starOf(opp.roster);

  const hints = {

    def: { man: 'Your best defenders guard their best players.', zone: 'Protects the paint and hides weak defenders. Gives up threes and rebounds.', press: 'Forces turnovers from weak passers. Drains your energy fast.' },

          <p><b>Star:</b> #${star.num} ${pname(star)} (${star.pos}, OVR ${ovr(star)})</p></div>
          <ul class="list-plain" style="margin-top:6px"><li>✓ <span><b>Defense: ${E(rec.def)}</b>. ${E(why.def)}</span></li><li>✓ <span><b>Offense: ${E(rec.focus)}</b>. ${E(why.focus)}</span></li><li>✓ <span><b>Tempo: ${E(rec.tempo)}</b>. ${E(why.tempo)}</span></li></ul>`
      : `<p class="muted" style="margin-top:6px">Their game plan is unknown. Add <b>Film Study</b> to next week’s practice or buy the <b>Scouting Service</b> in the Front Office to reveal it and see recommended counters.</p><p style="margin-top:4px">They’re rated <b>${oppRating(opp)}</b> (you: ${myRating()}).</p>`}

      ${out.length ? `<p class="muted" style="margin-top:8px;font-size:.92rem">Unavailable: ${out.map(p => `${pname(p)} (${p.inj ? 'injured' : p.suspended ? 'suspended' : 'GPA ' + p.gpa.toFixed(2)})`).join(', ')}</p>` : ''}

}

/* Recap */
function recapPanel() {
  const g = G.lastGame; if (!g) return '';
  const opp = teamById(g.opp); const mvp = g.mvp && G.roster.find(p => p.id === g.mvp.id);
  const ch = [];
  const dm = g.after.morale - g.before.morale; ch.push(dm === 0 ? neutralChip('Morale', '±0') : deltaChip('Morale', U.signed(dm), dm > 0));
  const dc = g.after.chem - Math.round(g.before.chem); ch.push(dc === 0 ? neutralChip('Chemistry', '±0') : deltaChip('Chemistry', U.signed(dc), dc > 0));
  const df = g.after.fans - g.before.fans; ch.push(df === 0 ? neutralChip('Fans', '±0') : deltaChip('Fans', U.signed(df), df > 0));
  if (g.gate) ch.push(deltaChip('Gate revenue', '+' + U.money(g.gate), true)); if (g.travel) ch.push(deltaChip('Travel', '−' + U.money(g.travel), false));
  g.injuries.forEach(id => { const p = G.roster.find(x => x.id === id); if (p) ch.push(deltaChip(p.last, `injured ${p.inj} wk`, false)); });
  const next = G.phase === 'playoffs' ? (g.win ? (G.playoffs.round === 3 ? 'Celebrate the title →' : `On to the ${ROUNDS[G.playoffs.round + 1]} →`) : 'See how your season ended →') : G.week >= 10 ? 'See final standings →' : `Start week ${G.week + 1} →`;
  return `${coachTip('recap', 'After each game, morale and chemistry shift. Bench players who never see the floor lose morale. Home games earn gate money; road games cost travel.')}
  <div class="stack">
    <div class="result-banner ${g.win ? 'win' : ''}" role="status"><div class="big">${g.win ? 'WIN' : 'LOSS'} ${g.us}–${g.them}</div><div>${g.home ? 'vs' : g.neutral ? 'vs' : '@'} ${E(opp.name)} ${E(opp.mascot)}<br><span style="opacity:.85">${E(g.label)}</span></div></div>
    ${G.filmBaseline ? '<button class="film-invite" data-act="open-film"><span>WHAT IF, COACH?</span><strong>One game. Two decisions. Two different stories.</strong><small>Enter Decision Replay →</small></button>' : ''}
    ${lineScore(g, opp)}
    <div class="grid2">
      <section class="card"><h2 class="eyebrow">Player of the game</h2>${mvp ? `<div class="row" style="margin-top:8px">${jersey(mvp)}<b>${pname(mvp)}</b><span class="chip team">${g.mvp.pts} PTS · ${g.mvp.reb} REB · ${g.mvp.ast} AST</span></div>` : ''}</section>
      <section class="card"><h2 class="eyebrow">What changed</h2><div class="deltas">${ch.join('')}</div></section>
    </div>
    <details class="card"><summary style="cursor:pointer;font-weight:700">Box score</summary>${boxTable(g.box, G.roster, 'Your team')}${boxTable(g.box, opp.roster, opp.name)}</details>
    <div class="cta-bar"><button class="btn big primary" data-act="end-week">${next}</button></div>
  </div>`;
}
function lineScore(g, opp) {

  <tr class="me"><th scope="row">${E(G.school.name)}</th>${g.qs.map(q => `<td class="n">${q[0]}</td>`).join('')}${ot ? `<td class="n">${ot[0]}</td>` : ''}<td class="n"><b>${g.us}</b></td></tr>
  <tr><th scope="row">${E(opp.name)}</th>${g.qs.map(q => `<td class="n">${q[1]}</td>`).join('')}${ot ? `<td class="n">${ot[1]}</td>` : ''}<td class="n"><b>${g.them}</b></td></tr></tbody></table></div>`;

function filmPanel() {
  const demo = UI.modal && UI.modal.type === 'film';

  if (!snapshot) return `<section class="film-room"><div class="film-kicker">WHAT IF, COACH?</div><h2>The final score isn’t the final lesson.</h2><p>Play your first game, then return here to test a different tactical approach against the same opponent. Your season result stays yours.</p><button class="btn" data-act="film-demo">Try an exhibition replay →</button></section>`;
  const strategy = result ? result.alternative.strategy : { tempo: 'fast', def: 'zone', focus: 'perimeter' };
  const options = (key, label, values) => `<label>${label}<select name="film-${key}" id="film-${key}">${values.map(([value, text]) => `<option value="${value}" ${strategy[key] === value ? 'selected' : ''}>${text}</option>`).join('')}</select></label>`;
  const a = result && result.original, b = result && result.alternative;
  const line = (r, color) => {

    return `<polyline points="${values.map((v,i) => `${40 + i*440/Math.max(a.quarters.length,b.quarters.length)},${95-v/max*63}`).join(' ')}" fill="none" stroke="${color}" stroke-width="4" stroke-linejoin="round"/>`;
  };

    ${result ? `<div class="film-scores">${score(a,'A / ORIGINAL TACTICS','film-a')}${score(b,'B / YOUR ALTERNATE CALL','film-b')}</div><figure class="film-chart"><figcaption>THE GAME BRANCHES HERE <span>Score margin by period · above the line = your team leads</span></figcaption><svg viewBox="0 0 520 190" role="img" aria-label="Original and alternate score margins by period. Final margins ${a.us-a.them} and ${b.us-b.them}."><path d="M40 95H480" stroke="#8392a6" stroke-dasharray="4 6"/><text x="7" y="99" fill="#b6c3d3" font-size="11">TIE</text>${line(a,'#70d7e0')}${line(b,'#ffb96a')}<g fill="#aabace" font-size="11"><text x="32" y="184">TIP</text>${Array.from({length:Math.max(a.quarters.length,b.quarters.length)},(_,i)=>`<text x="${40+(i+1)*440/Math.max(a.quarters.length,b.quarters.length)}" y="184" text-anchor="middle">${i<4?'Q'+(i+1):'OT'+(i-3)}</text>`).join('')}</g></svg></figure><div class="film-metrics">${[['3-pointers',a.threes,b.threes],['Rebounds',a.rebounds,b.rebounds],['Energy left',a.energy,b.energy]].map(([name,x,y])=>`<div><span>${name}</span><strong><i>${x}</i> → <b>${y}</b></strong></div>`).join('')}</div><p class="film-verdict">${b.us-b.them > a.us-a.them ? 'Your alternate call improved the simulated margin by '+((b.us-b.them)-(a.us-a.them))+' point'+(Math.abs((b.us-b.them)-(a.us-a.them))===1?'':'s')+'.' : b.us-b.them < a.us-a.them ? 'Your original tactics performed better by '+((a.us-a.them)-(b.us-b.them))+' points in this experiment.' : 'Both plans finished with the same margin. Compare the energy cost and shot mix.'}</p>` : '<div class="film-empty">A decision is a hypothesis.<br><strong>Put yours to the test.</strong></div>'}
    <details class="film-method"><summary>How this experiment works</summary><p>Both branches replay the saved pregame state using automatic rotations and a calm halftime talk. Branch A uses your original starting tactics; Branch B uses the choices above. Neither includes manual in-game interventions, so A may differ from the score you actually played. One seeded experiment illustrates a possible outcome, not a guaranteed tactical advantage. Nothing here changes your record, resources, injuries or future randomness.</p></details></section>`;
}
function sparkChart(title, vals, hist, fixed) {
  if (vals.length < 2) return `<div><h3 class="eyebrow">${title}</h3><p class="muted">Not enough weeks to chart.</p></div>`;
  const W = 460, H = 180, pl = 34, pr = 12, pt = 14, pb = 30; const lo = fixed ? 0 : Math.floor(Math.min(...vals) - 2), hi = fixed ? 100 : Math.ceil(Math.max(...vals) + 2);
  const x = i => pl + i * (W - pl - pr) / (vals.length - 1), y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const ticks = fixed ? [0, 50, 100] : [lo, Math.round((lo + hi) / 2), hi];
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area = d + ` L${x(vals.length - 1).toFixed(1)} ${y(lo)} L${x(0)} ${y(lo)} Z`;
  return `<figure style="margin:0"><figcaption class="eyebrow">${title}</figcaption><svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}: from ${vals[0]} to ${vals[vals.length - 1]}">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)" stroke-width="1"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-2)" font-family="var(--f-data)">${t}</text>`).join('')}
    <path d="${area}" fill="var(--team)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--team)" stroke-width="2" stroke-linejoin="round"/>
    ${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === vals.length - 1 ? 5 : 3.5}" fill="var(--team)" stroke="var(--surface)" stroke-width="2"><title>${hist[i].w}: ${v}${hist[i].win != null ? (hist[i].win ? ' (W)' : ' (L)') : ''}</title></circle>`).join('')}
    ${hist.map((h, i) => (vals.length <= 8 || i % 2 === 0 || i === hist.length - 1) ? `<text x="${x(i)}" y="${H - 14}" text-anchor="middle" font-size="10" fill="var(--ink-2)" font-family="var(--f-data)">${h.w}</text><text x="${x(i)}" y="${H - 2}" text-anchor="middle" font-size="10" font-weight="700" fill="${h.win ? 'var(--good)' : 'var(--bad)'}" font-family="var(--f-data)">${h.win ? 'W' : 'L'}</text>` : '').join('')}
    <text x="${x(vals.length - 1)}" y="${y(vals[vals.length - 1]) - 9}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)" font-family="var(--f-data)">${vals[vals.length - 1]}</text>
  </svg></figure>`;
}

}

  <p class="muted">${E(p.trait)}: ${E(TRAITS[p.trait].d)}</p>

  'clear-plan'() { G.plan = new Array(practiceSlots()).fill(null); UI.slot = 0; save(); render('[data-act="slot"][data-i="0"]'); },
  'run-practice'(d, el) { if (el.getAttribute('aria-disabled') === 'true') { toast($('#prac-why').textContent); return; } runPractice(); UI.slot = null; seenTip('practice'); SFX.whistle(); save(); render('.tabpanel h2'); },

/* ---------- Wiring ---------- */
document.addEventListener('click', ev => {

  if (a === 'modal-bg') { if (ev.target === el) closeModal(); return; }
  if (ACT[a]) { if (a === 'setup-go') ev.preventDefault(); ACT[a](el.dataset, el, ev); }
});
document.addEventListener('change', ev => {
  const el = ev.target; if (UI.screen === 'setup' && el.name && ['mascot', 'pal', 'diff'].includes(el.name)) { UI.setup[el.name] = el.value; if (el.name === 'diff') { SET.diff = el.value; saveSettings(); } updateSetupPreview(); return; }
  const a = el.dataset && el.dataset.act; if (a && ACT[a]) ACT[a](el.dataset, el, ev);
});
document.addEventListener('input', ev => { if (ev.target.id === 'f-name') { UI.setup.name = ev.target.value.slice(0, 16); updateSetupPreview(); } if (ev.target.id === 'f-seed') UI.setup.seed = ev.target.value; });

document.addEventListener('keydown', ev => {
  const tag = (ev.target.tagName || '').toLowerCase(); const typing = tag === 'input' && ev.target.type === 'text';
  if (ev.key === 'Escape' && UI.modal) { ev.preventDefault(); closeModal(); return; }
  if (UI.modal && ev.key === 'Tab') { const f = $$('.modal button, .modal input, .modal select, .modal a[href], .modal summary, .modal [tabindex]:not([tabindex="-1"])').filter(x => !x.disabled); if (f.length) { const first = f[0], last = f[f.length - 1]; if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); } else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); } } return; }
  if (typing || UI.modal) return;
  if (ev.key === '?' || ev.key === 'h' || ev.key === 'H') { ev.preventDefault(); ACT.help(); return; }
  if (UI.screen === 'hub' && G && G.step === 'event' && !G.eventDone && /^[1-3]$/.test(ev.key)) { const b = $(`[data-act="choose"][data-i="${+ev.key - 1}"]`); if (b) { ev.preventDefault(); b.click(); } return; }
  if (UI.screen === 'game' && UI.play) {
    const tb = $('[data-act="talk"]'); if (tb && /^[1-3]$/.test(ev.key)) { const b = $$('[data-act="talk"]')[+ev.key - 1]; if (b) { ev.preventDefault(); b.click(); } return; }
    if (ev.key === ' ' && !UI.play.panel && tag !== 'button' && tag !== 'input' && tag !== 'select') { ev.preventDefault(); ACT.pause(); }
    if ((ev.key === 's' || ev.key === 'S') && !UI.play.panel) { ev.preventDefault(); ACT.skipq(); }
    if ((ev.key === 't' || ev.key === 'T') && !UI.play.panel) { ev.preventDefault(); openTimeout(UI.sim.to.full ? 'full' : 'short'); }
  }
  if (ev.target.getAttribute && ev.target.getAttribute('role') === 'tab' && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) { const tabs = $$('[role="tab"]'); const i = tabs.indexOf(ev.target); const n = tabs[(i + (ev.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length]; n.click(); }
});
if (window.matchMedia) { try { matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', () => { if (Court.cv) Court.reduced = reduced(); }); } catch (e) {} }
window.addEventListener('resize', () => { if (UI.screen === 'title') { const cv = $('#floor'); if (cv) drawTitleFloor(cv, G ? schoolColors()[0] : '#A6192E'); } });

/* ---------- Test / balance hooks (used by the automated test suite) ---------- */
window.RTC = {
  get G() { return G; }, UI, SET,
  newGame, finalizeTryouts, autoSignBest, runPractice, drawEvent, resolveEvent, newGameSim, simQuarter, applyHalftime, finishGame, endWeek, recommend, isScouted, currentGameInfo, myRating, oppRating, standings, PRESETS, EVENTS, DRILLS, UPGRADES,
  // Plays one season headlessly with a simple policy (assumes G exists and is at tryouts).
  playSeason(pol = 'smart') {
    autoSignBest(); finalizeTryouts(); let guard = 0; const startR = myRating(), boss = oppRating(G.stateField[2]), dist = Math.round(U.avg(G.teams.map(oppRating)));
    while (G.phase !== 'ended' && guard++ < 40) {
      if (pol === 'smart') {
        if (G.upgrades.assistant !== true && G.res.budget >= 1300) { G.res.budget -= 1200; G.upgrades.assistant = true; }
        else if (!G.upgrades.scouting && G.res.budget >= 600) { G.res.budget -= 500; G.upgrades.scouting = true; }
        const e = U.avg(G.roster.map(p => p.energy)); const lowGpa = G.roster.some(p => p.gpa < 2.15);
        G.plan = (e < 55 ? ['shooting', 'rest', lowGpa ? 'study' : 'bonding', 'film'] : ['shooting', 'defense', lowGpa ? 'study' : 'scrimmage', 'film']).slice(0, practiceSlots());
      } else G.plan = ['scrimmage', 'scrimmage', 'conditioning', 'shooting'].slice(0, practiceSlots());
      runPractice(); G.step = 'event'; drawEvent(); const ev = EVENTS.find(x => x.id === G.event.id); resolveEvent(pol === 'smart' ? 0 : ri(0, ev.choices.length - 1)); G.step = 'prep';
      autoLineup();
      if (pol === 'smart') { const { rec } = recommend(currentOpp()); G.strategy = Object.assign({ rot: 'normal' }, rec); } else G.strategy = { tempo: 'balanced', def: 'man', focus: 'balanced', rot: 'normal' };
      const sim = newGameSim(); sim.headless = true; while (!sim.done) { if (sim.q === 2 && !sim.halfTalk) applyHalftime(sim, 'calm'); simQuarter(sim); }
      finishGame(sim); G.step = 'recap'; endWeek();
    }
    return { kind: G.ending.kind, rec: allRecord(), grade: G.ending.legacy.grade, rating: myRating(), startR, boss, dist };
  },
  autoSeason(opts = {}) { newGame({ name: 'Test', diff: opts.diff || 'varsity', seed: opts.seed || String(Math.random()) }); return this.playSeason(opts.policy || 'smart'); },

};

/* ---------- Boot ---------- */
function boot() {
  applySettings();
  const s = loadSave(); if (s) G = s;
  if (G) applyTeamColors();
  const firstTouch = () => { SFX.init(); setTimeout(() => { if (UI.screen !== 'game') Music.play(); }, 50); };
  document.addEventListener('pointerdown', firstTouch, { once: true }); document.addEventListener('keydown', firstTouch, { once: true });
  render();
}
boot();
